GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_EquipmentEnchantAdd:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EquipmentEnchantAdd"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "iron-sword"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":30}"
            acquireActions:
              - action: "Gs2Enchant:AddRarityParameterStatusByUserId"
                request: "{\"count\":1,\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
          - name: "oak-staff"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":30}"
            acquireActions:
              - action: "Gs2Enchant:AddRarityParameterStatusByUserId"
                request: "{\"count\":1,\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
          - name: "steel-shield"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":30}"
            acquireActions:
              - action: "Gs2Enchant:AddRarityParameterStatusByUserId"
                request: "{\"count\":1,\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EquipmentEnchantAdd"
  ExchangeCurrentRateMaster_EquipmentEnchantReroll:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EquipmentEnchantReroll"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "iron-sword"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":10}"
            acquireActions:
              - action: "Gs2Enchant:ReDrawRarityParameterStatusByUserId"
                request: "{\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
          - name: "oak-staff"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":10}"
            acquireActions:
              - action: "Gs2Enchant:ReDrawRarityParameterStatusByUserId"
                request: "{\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
          - name: "steel-shield"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":10}"
            acquireActions:
              - action: "Gs2Enchant:ReDrawRarityParameterStatusByUserId"
                request: "{\"namespaceName\":\"EquipmentEnchant\",\"parameterName\":\"standard\",\"propertyId\":\"#{propertyId}\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EquipmentEnchantReroll"
  ExchangeNamespace_EquipmentEnchantAdd:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EquipmentEnchantAdd"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_EquipmentEnchantReroll:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EquipmentEnchantReroll"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
