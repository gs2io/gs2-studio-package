GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_CharacterRecruit:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "CharacterRecruit"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "archer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"archer\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
          - name: "healer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"healer\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
          - name: "knight"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"knight\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
          - name: "mage"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"mage\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_CharacterRecruit"
  ExchangeCurrentRateMaster_CharacterTrain:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "CharacterTrain"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "archer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":40,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "healer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":40,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "knight"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":40,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "mage"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":40,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_CharacterTrain"
  ExchangeNamespace_CharacterRecruit:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "CharacterRecruit"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_CharacterTrain:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "CharacterTrain"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
