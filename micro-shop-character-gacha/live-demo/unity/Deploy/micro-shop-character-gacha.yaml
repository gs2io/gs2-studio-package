GS2TemplateFormatVersion: "2019-05-01"
Resources:
  LotteryCurrentLotteryMaster_CharacterGacha:
    Type: "GS2::Lottery::CurrentLotteryMaster"
    Properties:
      NamespaceName: "CharacterGacha"
      Settings:
        version: "2019-02-21"
        lotteryModels:
          - method: "prize_table"
            mode: "normal"
            name: "standard"
            prizeTableName: "standard"
        prizeTables:
          - name: "standard"
            prizes:
              - prizeId: "standard.common"
                prizeTableName: "common"
                type: "prize_table"
                weight: 80
              - prizeId: "standard.rare"
                prizeTableName: "rare"
                type: "prize_table"
                weight: 20
          - name: "common"
            prizes:
              - prizeId: "common.archer"
                type: "action"
                weight: 1
                acquireActions:
                  - action: "Gs2Inventory:AcquireItemSetByUserId"
                    request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"archer\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
                  - action: "Gs2Dictionary:AddEntriesByUserId"
                    request: "{\"entryModelNames\":[\"archer\"],\"namespaceName\":\"CharacterDictionary\",\"userId\":\"#{userId}\"}"
              - prizeId: "common.knight"
                type: "action"
                weight: 1
                acquireActions:
                  - action: "Gs2Inventory:AcquireItemSetByUserId"
                    request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"knight\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
                  - action: "Gs2Dictionary:AddEntriesByUserId"
                    request: "{\"entryModelNames\":[\"knight\"],\"namespaceName\":\"CharacterDictionary\",\"userId\":\"#{userId}\"}"
          - name: "rare"
            prizes:
              - prizeId: "rare.healer"
                type: "action"
                weight: 1
                acquireActions:
                  - action: "Gs2Inventory:AcquireItemSetByUserId"
                    request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"healer\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
                  - action: "Gs2Dictionary:AddEntriesByUserId"
                    request: "{\"entryModelNames\":[\"healer\"],\"namespaceName\":\"CharacterDictionary\",\"userId\":\"#{userId}\"}"
              - prizeId: "rare.mage"
                type: "action"
                weight: 1
                acquireActions:
                  - action: "Gs2Inventory:AcquireItemSetByUserId"
                    request: "{\"acquireCount\":1,\"inventoryName\":\"Character\",\"itemName\":\"mage\",\"namespaceName\":\"Character\",\"userId\":\"#{userId}\"}"
                  - action: "Gs2Dictionary:AddEntriesByUserId"
                    request: "{\"entryModelNames\":[\"mage\"],\"namespaceName\":\"CharacterDictionary\",\"userId\":\"#{userId}\"}"
      Mode: "direct"
    DependsOn:
      - "LotteryNamespace_CharacterGacha"
  LotteryNamespace_CharacterGacha:
    Type: "GS2::Lottery::Namespace"
    Properties:
      Name: "CharacterGacha"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ShowcaseCurrentShowcaseMaster_CharacterGacha:
    Type: "GS2::Showcase::CurrentShowcaseMaster"
    Properties:
      NamespaceName: "CharacterGacha"
      Settings:
        version: "2019-04-04"
        showcases:
          - name: "Showcase"
            displayItems:
              - displayItemId: "standard"
                type: "salesItem"
                salesItem:
                  metadata: ""
                  name: "standard"
                  verifyActions: []
                  consumeActions:
                    - action: "Gs2Money2:WithdrawByUserId"
                      request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":10}"
                  acquireActions:
                    - action: "Gs2Lottery:DrawByUserId"
                      request: "{\"count\":1,\"lotteryName\":\"standard\",\"namespaceName\":\"CharacterGacha\",\"userId\":\"#{userId}\"}"
                  bonuses: []
        randomShowcases: []
      Mode: "direct"
    DependsOn:
      - "ShowcaseNamespace_CharacterGacha"
  ShowcaseNamespace_CharacterGacha:
    Type: "GS2::Showcase::Namespace"
    Properties:
      Name: "CharacterGacha"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
