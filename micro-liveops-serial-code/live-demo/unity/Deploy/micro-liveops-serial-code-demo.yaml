GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_SerialCodeRedeem:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "SerialCodeRedeem"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "serialcoderedemption"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"SerialCodeLimit\",\"limitName\":\"serialcoderedemption\",\"counterName\":\"redeemed\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":1}"
              - action: "Gs2SerialKey:UseByUserId"
                request: "{\"namespaceName\":\"SerialCode\",\"userId\":\"#{userId}\",\"code\":\"#{code}\"}"
            acquireActions:
              - action: "Gs2Money2:DepositByUserId"
                request: "{\"namespaceName\":\"Currency\",\"userId\":\"#{userId}\",\"slot\":0,\"depositTransactions\":[{\"price\":0,\"currency\":\"\",\"count\":100}]}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_SerialCodeRedeem"
  ExchangeCurrentRateMaster_SerialCodeStartOver:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "SerialCodeStartOver"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "serialcoderedemption"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"namespaceName\":\"SerialCodeLimit\",\"limitName\":\"serialcoderedemption\",\"counterName\":\"redeemed\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_SerialCodeStartOver"
  ExchangeNamespace_SerialCodeRedeem:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "SerialCodeRedeem"
      TransactionSetting:
        AcquireActionUseJobQueue: false
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAtomicCommit: true
        EnableAutoRun: true
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
        TransactionUseDistributor: false
  ExchangeNamespace_SerialCodeStartOver:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "SerialCodeStartOver"
      TransactionSetting:
        AcquireActionUseJobQueue: false
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAtomicCommit: true
        EnableAutoRun: true
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
        TransactionUseDistributor: false
  LimitCurrentLimitMaster_SerialCodeLimit:
    Type: "GS2::Limit::CurrentLimitMaster"
    Properties:
      NamespaceName: "SerialCodeLimit"
      Settings:
        version: "2019-04-05"
        limitModels:
          - metadata: ""
            name: "serialcoderedemption"
            resetType: "notReset"
      Mode: "direct"
    DependsOn:
      - "LimitNamespace_SerialCodeLimit"
  LimitNamespace_SerialCodeLimit:
    Type: "GS2::Limit::Namespace"
    Properties:
      Name: "SerialCodeLimit"
      TransactionSetting:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAutoRun: false
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
