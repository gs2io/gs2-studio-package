GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_SerialCodeRedeem:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "SerialCodeRedeem"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "serialcoderedemption"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"redeemed\",\"limitName\":\"serialcoderedemption\",\"maxValue\":1,\"namespaceName\":\"SerialCodeLimit\",\"userId\":\"#{userId}\"}"
              - action: "Gs2SerialKey:UseByUserId"
                request: "{\"code\":\"#{code}\",\"namespaceName\":\"SerialCode\",\"userId\":\"#{userId}\"}"
            acquireActions:
              - action: "Gs2Money2:DepositByUserId"
                request: "{\"depositTransactions\":[{\"count\":100,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_SerialCodeRedeem"
  ExchangeCurrentRateMaster_SerialCodeStartOver:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "SerialCodeStartOver"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "serialcoderedemption"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"counterName\":\"redeemed\",\"limitName\":\"serialcoderedemption\",\"namespaceName\":\"SerialCodeLimit\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_SerialCodeStartOver"
  ExchangeNamespace_SerialCodeRedeem:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "SerialCodeRedeem"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_SerialCodeStartOver:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "SerialCodeStartOver"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  LimitCurrentLimitMaster_SerialCodeLimit:
    Type: "GS2::Limit::CurrentLimitMaster"
    Properties:
      NamespaceName: "SerialCodeLimit"
      Settings:
        version: "2019-04-05"
        limitModels:
          - metadata: ""
            name: "serialcoderedemption"
            resetType: "notReset"
      Mode: "direct"
    DependsOn:
      - "LimitNamespace_SerialCodeLimit"
  LimitNamespace_SerialCodeLimit:
    Type: "GS2::Limit::Namespace"
    Properties:
      Name: "SerialCodeLimit"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
