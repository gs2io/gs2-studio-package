GS2TemplateFormatVersion: "2019-05-01"
Resources:
  MissionCurrentMissionMaster_Mission:
    Type: "GS2::Mission::CurrentMissionMaster"
    Properties:
      NamespaceName: "Mission"
      Settings:
        version: "2019-05-28"
        groups:
          - completeNotificationNamespaceId: "grn:gs2:{region}:{ownerId}:gateway:Mission"
            name: "career"
            resetType: "notReset"
            tasks:
              - name: "career1"
                targetCounter:
                  counterName: "counter"
                  value: 1
                verifyCompleteType: "counter"
                completeAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":10,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - name: "career3"
                targetCounter:
                  counterName: "counter"
                  value: 3
                verifyCompleteType: "counter"
                completeAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":30,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - name: "career5"
                targetCounter:
                  counterName: "counter"
                  value: 5
                verifyCompleteType: "counter"
                completeAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":50,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
          - completeNotificationNamespaceId: "grn:gs2:{region}:{ownerId}:gateway:Mission"
            name: "daily"
            resetHour: 0
            resetType: "daily"
            tasks:
              - name: "daily2"
                targetCounter:
                  counterName: "counter"
                  value: 2
                verifyCompleteType: "counter"
                completeAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":20,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
        counters:
          - name: "counter"
            scopes:
              - resetHour: 0
                resetType: "daily"
                scopeType: "resetTiming"
              - resetDayOfWeek: "monday"
                resetHour: 0
                resetType: "weekly"
                scopeType: "resetTiming"
              - resetDayOfMonth: 1
                resetHour: 0
                resetType: "monthly"
                scopeType: "resetTiming"
              - resetType: "notReset"
                scopeType: "resetTiming"
      Mode: "direct"
    DependsOn:
      - "MissionNamespace_Mission"
  MissionNamespace_Mission:
    Type: "GS2::Mission::Namespace"
    Properties:
      CompleteNotification:
        Enable: "Enabled"
        EnableTransferMobileNotification: false
        GatewayNamespaceId: "grn:gs2:{region}:{ownerId}:gateway:default"
      Name: "Mission"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
