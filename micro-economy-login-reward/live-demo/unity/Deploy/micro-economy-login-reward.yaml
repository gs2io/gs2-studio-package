GS2TemplateFormatVersion: "2019-05-01"
Resources:
  LoginRewardCurrentBonusMaster_LoginReward:
    Type: "GS2::LoginReward::CurrentBonusMaster"
    Properties:
      NamespaceName: "LoginReward"
      Settings:
        version: "2023-07-11"
        bonusModels:
          - missedReceiveRelief: "disabled"
            mode: "streaming"
            name: "daily"
            repeat: "disabled"
            resetHour: 15
            rewards:
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":10,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":20,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":30,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":40,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":50,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":60,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
              - acquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":100,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
      Mode: "direct"
    DependsOn:
      - "LoginRewardNamespace_LoginReward"
  LoginRewardNamespace_LoginReward:
    Type: "GS2::LoginReward::Namespace"
    Properties:
      Name: "LoginReward"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
