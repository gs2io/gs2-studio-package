GS2TemplateFormatVersion: "2019-05-01"
Resources:
  QuestCurrentQuestMaster_Quest:
    Type: "GS2::Quest::CurrentQuestMaster"
    Properties:
      NamespaceName: "Quest"
      Settings:
        version: "2019-05-14"
        groups:
          - name: "main"
            quests:
              - name: "quest1"
                contents:
                  - completeAcquireActions:
                      - action: "Gs2Money2:DepositByUserId"
                        request: "{\"depositTransactions\":[{\"count\":10,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                firstCompleteAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":100,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                verifyActions: []
                consumeActions:
                  - action: "Gs2Stamina:ConsumeStaminaByUserId"
                    request: "{\"consumeValue\":10,\"namespaceName\":\"Energy\",\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
                failedAcquireActions: []
              - name: "quest2"
                contents:
                  - completeAcquireActions:
                      - action: "Gs2Money2:DepositByUserId"
                        request: "{\"depositTransactions\":[{\"count\":30,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                firstCompleteAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":200,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                verifyActions: []
                consumeActions:
                  - action: "Gs2Stamina:ConsumeStaminaByUserId"
                    request: "{\"consumeValue\":20,\"namespaceName\":\"Energy\",\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
                failedAcquireActions: []
              - name: "quest3"
                contents:
                  - completeAcquireActions:
                      - action: "Gs2Money2:DepositByUserId"
                        request: "{\"depositTransactions\":[{\"count\":60,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                firstCompleteAcquireActions:
                  - action: "Gs2Money2:DepositByUserId"
                    request: "{\"depositTransactions\":[{\"count\":300,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
                verifyActions: []
                consumeActions:
                  - action: "Gs2Stamina:ConsumeStaminaByUserId"
                    request: "{\"consumeValue\":30,\"namespaceName\":\"Energy\",\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
                failedAcquireActions: []
      Mode: "direct"
    DependsOn:
      - "QuestNamespace_Quest"
  QuestNamespace_Quest:
    Type: "GS2::Quest::Namespace"
    Properties:
      Name: "Quest"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
