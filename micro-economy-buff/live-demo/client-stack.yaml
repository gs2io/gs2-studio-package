# The WebGL player exposes this client credential; it cannot act as a trusted server secret.
# Clock controls need UpdateTimeOffset, so grant it through a separate revocable client.
# The action accepts a userId and returns the account, including its password.
# Keep its resource scope on the shared anonymous demo Account namespace:
# this permission is unsuitable for real accounts, and a wildcard reaches other namespaces.
# Replacing this credential requires updating the scaffolded player configuration
# and rebuilding published players; an already-built player retains the old credential.

GS2TemplateFormatVersion: "2019-05-01"

Globals:
  Alias:
    ClientUserName: demo-buff-client
    TimeOffsetPolicyName: demo-buff-client-time-offset

Resources:

  IdentifierClientUser:
    Type: GS2::Identifier::User
    Properties:
      Name: ${ClientUserName}
      Description: Client of the buff live demo

  IdentifierClientUserAttachApplicationAccess:
    Type: GS2::Identifier::AttachSecurityPolicy
    Properties:
      UserName: ${ClientUserName}
      SecurityPolicyId: grn:gs2::system:identifier:securityPolicy:ApplicationAccess
    DependsOn:
      - IdentifierClientUser

  IdentifierTimeOffsetPolicy:
    Type: GS2::Identifier::SecurityPolicy
    Properties:
      Name: ${TimeOffsetPolicyName}
      Description: Lets the buff live demo move a signed-in player's clock forward
      Policy:
        Version: "2016-04-01"
        Statements:
          - Effect: Allow
            Actions:
              - Gs2Account:UpdateTimeOffset
            Resources:
              - "grn:gs2:{region}:{ownerId}:account:Account:account:*"

  IdentifierClientUserAttachTimeOffsetPolicy:
    Type: GS2::Identifier::AttachSecurityPolicy
    Properties:
      UserName: ${ClientUserName}
      SecurityPolicyId: !GetAttr IdentifierTimeOffsetPolicy.Item.SecurityPolicyId
    DependsOn:
      - IdentifierClientUser
      - IdentifierTimeOffsetPolicy

  IdentifierClientIdentifier:
    Type: GS2::Identifier::Identifier
    Properties:
      UserName: ${ClientUserName}
    DependsOn:
      - IdentifierClientUser

Outputs:
  ApplicationClientId: !GetAttr IdentifierClientIdentifier.Item.ClientId
  ApplicationClientSecret: !GetAttr IdentifierClientIdentifier.ClientSecret
