GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_EquipmentDiscard:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EquipmentDiscard"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "iron-sword"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeItemSetByUserId"
                request: "{\"consumeCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"iron-sword\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "oak-staff"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeItemSetByUserId"
                request: "{\"consumeCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"oak-staff\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "steel-shield"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeItemSetByUserId"
                request: "{\"consumeCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"steel-shield\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
            acquireActions: []
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EquipmentDiscard"
  ExchangeCurrentRateMaster_EquipmentExpand:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EquipmentExpand"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "equipmentcollection"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AddCapacityByUserId"
                request: "{\"addCapacityValue\":2,\"inventoryName\":\"Equipment\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EquipmentExpand"
  ExchangeCurrentRateMaster_EquipmentTake:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EquipmentTake"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "iron-sword"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"iron-sword\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
          - name: "oak-staff"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"oak-staff\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
          - name: "steel-shield"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireItemSetByUserId"
                request: "{\"acquireCount\":1,\"inventoryName\":\"Equipment\",\"itemName\":\"steel-shield\",\"namespaceName\":\"Equipment\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EquipmentTake"
  ExchangeNamespace_EquipmentDiscard:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EquipmentDiscard"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_EquipmentExpand:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EquipmentExpand"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_EquipmentTake:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EquipmentTake"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
