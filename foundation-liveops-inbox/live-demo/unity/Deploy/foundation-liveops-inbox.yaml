GS2TemplateFormatVersion: "2019-05-01"
Resources:
  InboxCurrentMessageMaster_Inbox:
    Type: "GS2::Inbox::CurrentMessageMaster"
    Properties:
      NamespaceName: "Inbox"
      Settings:
        version: "2020-03-12"
        globalMessages:
          - metadata: "Welcome to the GS2 inbox demo!"
            name: "welcome"
            messageReceptionPeriodEventId: "grn:gs2:{region}:{ownerId}:schedule:InboxSchedule:event:welcome"
            readAcquireActions: []
      Mode: "direct"
    DependsOn:
      - "InboxNamespace_Inbox"
  InboxNamespace_Inbox:
    Type: "GS2::Inbox::Namespace"
    Properties:
      Name: "Inbox"
      TransactionSetting:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAutoRun: false
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
  ScheduleCurrentEventMaster_InboxSchedule:
    Type: "GS2::Schedule::CurrentEventMaster"
    Properties:
      NamespaceName: "InboxSchedule"
      Settings:
        version: "2019-03-31"
        events:
          - absoluteBegin: 1789064562011
            absoluteEnd: 1924992000000
            name: "welcome"
            scheduleType: "absolute"
      Mode: "direct"
    DependsOn:
      - "ScheduleNamespace_InboxSchedule"
  ScheduleNamespace_InboxSchedule:
    Type: "GS2::Schedule::Namespace"
    Properties:
      Name: "InboxSchedule"
      TransactionSetting:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAutoRun: false
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
