GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_InboxDeliver:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "InboxDeliver"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "welcome"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inbox:SendMessageByUserId"
                request: "{\"expiresTimeSpan\":{\"days\":7},\"metadata\":\"Welcome to the GS2 inbox demo!\",\"namespaceName\":\"Inbox\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_InboxDeliver"
  ExchangeCurrentRateMaster_InboxGift:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "InboxGift"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "gift"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inbox:SendMessageByUserId"
                request: "{\"expiresTimeSpan\":{\"days\":7},\"metadata\":\"A gift from the operator: 100 coins.\",\"namespaceName\":\"Inbox\",\"readAcquireActions\":[{\"action\":\"Gs2Money2:DepositByUserId\",\"request\":\"{\\\"depositTransactions\\\":[{\\\"count\\\":100,\\\"currency\\\":\\\"\\\",\\\"price\\\":0}],\\\"namespaceName\\\":\\\"Currency\\\",\\\"slot\\\":0,\\\"userId\\\":\\\"#{userId}\\\"}\"}],\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_InboxGift"
  ExchangeNamespace_InboxDeliver:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "InboxDeliver"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_InboxGift:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "InboxGift"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
