GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_CurrencyGrant:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "CurrencyGrant"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "freedeposit"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Money2:DepositByUserId"
                request: "{\"depositTransactions\":[{\"count\":100,\"currency\":\"\",\"price\":0}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
          - name: "paiddeposit"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Money2:DepositByUserId"
                request: "{\"depositTransactions\":[{\"count\":50,\"currency\":\"JPY\",\"price\":120}],\"namespaceName\":\"Currency\",\"slot\":0,\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_CurrencyGrant"
  ExchangeNamespace_CurrencyGrant:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "CurrencyGrant"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
