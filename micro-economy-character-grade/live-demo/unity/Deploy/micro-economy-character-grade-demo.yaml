GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_CharacterGradeTrain:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "CharacterGradeTrain"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "archer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":1000,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "healer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":1000,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "knight"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":1000,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "mage"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Experience:AddExperienceByUserId"
                request: "{\"experienceName\":\"Experience\",\"experienceValue\":1000,\"namespaceName\":\"CharacterExperience\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_CharacterGradeTrain"
  ExchangeCurrentRateMaster_CharacterLimitBreak:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "CharacterLimitBreak"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "archer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Grade:AddGradeByUserId"
                request: "{\"gradeName\":\"CharacterGrade\",\"gradeValue\":1,\"namespaceName\":\"CharacterGrade\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "healer"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Grade:AddGradeByUserId"
                request: "{\"gradeName\":\"CharacterGrade\",\"gradeValue\":1,\"namespaceName\":\"CharacterGrade\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "knight"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Grade:AddGradeByUserId"
                request: "{\"gradeName\":\"CharacterGrade\",\"gradeValue\":1,\"namespaceName\":\"CharacterGrade\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
          - name: "mage"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Grade:AddGradeByUserId"
                request: "{\"gradeName\":\"CharacterGrade\",\"gradeValue\":1,\"namespaceName\":\"CharacterGrade\",\"propertyId\":\"#{propertyId}:level\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_CharacterLimitBreak"
  ExchangeNamespace_CharacterGradeTrain:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "CharacterGradeTrain"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_CharacterLimitBreak:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "CharacterLimitBreak"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
