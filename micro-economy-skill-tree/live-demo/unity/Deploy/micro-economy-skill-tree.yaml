GS2TemplateFormatVersion: "2019-05-01"
Resources:
  SkillTreeCurrentTreeMaster_SkillTree:
    Type: "GS2::SkillTree::CurrentTreeMaster"
    Properties:
      NamespaceName: "SkillTree"
      Settings:
        version: "2023-09-06"
        nodeModels:
          - metadata: ""
            name: "first"
            premiseNodeNames: []
            restrainReturnRate: 0.5
            releaseVerifyActions: []
            releaseConsumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":10}"
            returnAcquireActions: []
          - metadata: ""
            name: "last"
            premiseNodeNames:
              - "left"
              - "right"
            restrainReturnRate: 0.5
            releaseVerifyActions: []
            releaseConsumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":50}"
            returnAcquireActions: []
          - metadata: ""
            name: "left"
            premiseNodeNames:
              - "first"
            restrainReturnRate: 0.5
            releaseVerifyActions: []
            releaseConsumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":20}"
            returnAcquireActions: []
          - metadata: ""
            name: "right"
            premiseNodeNames:
              - "first"
            restrainReturnRate: 0.5
            releaseVerifyActions: []
            releaseConsumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":20}"
            returnAcquireActions: []
      Mode: "direct"
    DependsOn:
      - "SkillTreeNamespace_SkillTree"
  SkillTreeNamespace_SkillTree:
    Type: "GS2::SkillTree::Namespace"
    Properties:
      Name: "SkillTree"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
