GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_EnergyProduct:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "EnergyProduct"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "refill_large"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":100}"
            acquireActions:
              - action: "Gs2Stamina:RecoverStaminaByUserId"
                request: "{\"namespaceName\":\"Energy\",\"recoverValue\":40,\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
          - name: "refill_medium"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":70}"
            acquireActions:
              - action: "Gs2Stamina:RecoverStaminaByUserId"
                request: "{\"namespaceName\":\"Energy\",\"recoverValue\":15,\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
          - name: "refill_small"
            verifyActions: []
            consumeActions:
              - action: "Gs2Money2:WithdrawByUserId"
                request: "{\"namespaceName\":\"Currency\",\"paidOnly\":false,\"slot\":0,\"userId\":\"#{userId}\",\"withdrawCount\":30}"
            acquireActions:
              - action: "Gs2Stamina:RecoverStaminaByUserId"
                request: "{\"namespaceName\":\"Energy\",\"recoverValue\":5,\"staminaName\":\"stamina\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_EnergyProduct"
  ExchangeNamespace_EnergyProduct:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "EnergyProduct"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
