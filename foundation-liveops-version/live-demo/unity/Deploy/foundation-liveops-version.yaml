            scope: "active"
            type: "simple"
            warningVersion:
              major: 1
              micro: 0
              minor: 0
      Mode: "direct"
    DependsOn:
      - "VersionNamespace_Version"
  VersionNamespace_Version:
    Type: "GS2::Version::Namespace"
    Properties:
      AssumeUserId: "grn:gs2::{ownerId}:identifier:user:demo-version-passed"
      Name: "Version"
      TransactionSetting:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAutoRun: false
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
