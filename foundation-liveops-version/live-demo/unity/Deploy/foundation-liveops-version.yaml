            currentVersion:
              major: 1
              micro: 0
              minor: 0
            errorVersion:
              major: 0
              micro: 0
              minor: 0
            name: "marketing"
            scope: "active"
            type: "simple"
            warningVersion:
              major: 0
              micro: 0
              minor: 0
          - approveRequirement: "required"
            currentVersion:
              major: 2
              micro: 0
              minor: 0
            errorVersion:
              major: 0
              micro: 0
              minor: 0
