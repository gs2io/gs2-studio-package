GS2TemplateFormatVersion: "2019-05-01"
Resources:
  VersionCurrentVersionMaster_Version:
    Type: "GS2::Version::CurrentVersionMaster"
    Properties:
      NamespaceName: "Version"
      Settings:
        version: "2019-10-09"
        versionModels:
          - errorVersion:
              major: 1
              micro: 0
              minor: 0
            name: "app"
            needSignature: false
            scope: "passive"
            type: "simple"
            warningVersion:
              major: 1
              micro: 0
              minor: 1
          - errorVersion:
              major: 1
              micro: 0
              minor: 0
            name: "asset"
            needSignature: false
            scope: "passive"
            type: "simple"
            warningVersion:
              major: 2
              micro: 0
              minor: 0
