GS2TemplateFormatVersion: "2019-05-01"
Resources:
  AdRewardNamespace_Ad:
    Type: "GS2::AdReward::Namespace"
    Properties:
      Admob:
        AllowAdUnitIds:
          - "showroom-demo-placeholder"
      ChangePointNotification:
        Enable: "Enabled"
        EnableTransferMobileNotification: false
        GatewayNamespaceId: "grn:gs2:{region}:{ownerId}:gateway:default"
      Name: "Ad"
      TransactionSetting:
        AcquireActionUseJobQueue: false
        CommitScriptResultInUseDistributor: false
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableAtomicCommit: false
        EnableAutoRun: false
        QueueNamespaceId: "grn:gs2:{region}:{ownerId}:queue:default"
        TransactionUseDistributor: false
      UnityAd:
        Keys:
          - "showroom-demo-placeholder"
