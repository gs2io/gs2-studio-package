GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_LimitAdUse:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "LimitAdUse"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "counter1"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"point\":1,\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter1\",\"limitName\":\"daily\",\"maxValue\":5,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter2"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"point\":1,\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter2\",\"limitName\":\"daily\",\"maxValue\":4,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter3"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"point\":1,\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter3\",\"limitName\":\"daily\",\"maxValue\":6,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter4"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"point\":1,\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter4\",\"limitName\":\"weekly\",\"maxValue\":1,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_LimitAdUse"
  ExchangeCurrentRateMaster_LimitFreeUse:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "LimitFreeUse"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "counter1"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter1\",\"limitName\":\"daily\",\"maxValue\":3,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter2"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter2\",\"limitName\":\"daily\",\"maxValue\":4,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter3"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter3\",\"limitName\":\"daily\",\"maxValue\":6,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "counter4"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"countUpValue\":1,\"counterName\":\"counter4\",\"limitName\":\"weekly\",\"maxValue\":1,\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
            acquireActions: []
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
