GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_LimitAdUse:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "LimitAdUse"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "counter1"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"userId\":\"#{userId}\",\"point\":1}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"daily\",\"counterName\":\"counter1\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":5}"
            acquireActions: []
          - name: "counter2"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"userId\":\"#{userId}\",\"point\":1}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"daily\",\"counterName\":\"counter2\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":4}"
            acquireActions: []
          - name: "counter3"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"userId\":\"#{userId}\",\"point\":1}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"daily\",\"counterName\":\"counter3\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":6}"
            acquireActions: []
          - name: "counter4"
            verifyActions: []
            consumeActions:
              - action: "Gs2AdReward:ConsumePointByUserId"
                request: "{\"namespaceName\":\"Ad\",\"userId\":\"#{userId}\",\"point\":1}"
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"weekly\",\"counterName\":\"counter4\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":1}"
            acquireActions: []
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_LimitAdUse"
  ExchangeCurrentRateMaster_LimitFreeUse:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "LimitFreeUse"
      Settings:
        version: "2019-08-19"
