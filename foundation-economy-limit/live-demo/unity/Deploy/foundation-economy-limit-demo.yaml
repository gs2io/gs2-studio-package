        version: "2019-08-19"
        rateModels:
          - name: "counter1"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"counterName\":\"counter1\",\"limitName\":\"daily\",\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"counterName\":\"counter2\",\"limitName\":\"daily\",\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"counterName\":\"counter3\",\"limitName\":\"daily\",\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
              - action: "Gs2Limit:DeleteCounterByUserId"
                request: "{\"counterName\":\"counter4\",\"limitName\":\"weekly\",\"namespaceName\":\"Limit\",\"userId\":\"#{userId}\"}"
          - name: "counter2"
