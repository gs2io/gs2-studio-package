                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"daily\",\"counterName\":\"counter2\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":4}"
            acquireActions: []
          - name: "counter3"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"daily\",\"counterName\":\"counter3\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":6}"
            acquireActions: []
          - name: "counter4"
            verifyActions: []
            consumeActions:
              - action: "Gs2Limit:CountUpByUserId"
                request: "{\"namespaceName\":\"Limit\",\"limitName\":\"weekly\",\"counterName\":\"counter4\",\"userId\":\"#{userId}\",\"countUpValue\":1,\"maxValue\":1}"
            acquireActions: []
        incrementalRateModels: []
