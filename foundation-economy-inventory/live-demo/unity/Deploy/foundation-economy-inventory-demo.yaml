GS2TemplateFormatVersion: "2019-05-01"
Resources:
  ExchangeCurrentRateMaster_ItemGain:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "ItemGain"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "elixir"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireSimpleItemsByUserId"
                request: "{\"acquireCounts\":[{\"count\":1,\"itemName\":\"elixir\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
          - name: "ether"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireSimpleItemsByUserId"
                request: "{\"acquireCounts\":[{\"count\":1,\"itemName\":\"ether\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
          - name: "potion"
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: "Gs2Inventory:AcquireSimpleItemsByUserId"
                request: "{\"acquireCounts\":[{\"count\":1,\"itemName\":\"potion\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_ItemGain"
  ExchangeCurrentRateMaster_ItemSpend:
    Type: "GS2::Exchange::CurrentRateMaster"
    Properties:
      NamespaceName: "ItemSpend"
      Settings:
        version: "2019-08-19"
        rateModels:
          - name: "elixir"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeSimpleItemsByUserId"
                request: "{\"consumeCounts\":[{\"count\":1,\"itemName\":\"elixir\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "ether"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeSimpleItemsByUserId"
                request: "{\"consumeCounts\":[{\"count\":1,\"itemName\":\"ether\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
            acquireActions: []
          - name: "potion"
            verifyActions: []
            consumeActions:
              - action: "Gs2Inventory:ConsumeSimpleItemsByUserId"
                request: "{\"consumeCounts\":[{\"count\":1,\"itemName\":\"potion\"}],\"inventoryName\":\"Inventory\",\"namespaceName\":\"Inventory\",\"userId\":\"#{userId}\"}"
            acquireActions: []
        incrementalRateModels: []
      Mode: "direct"
    DependsOn:
      - "ExchangeNamespace_ItemSpend"
  ExchangeNamespace_ItemGain:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "ItemGain"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
  ExchangeNamespace_ItemSpend:
    Type: "GS2::Exchange::Namespace"
    Properties:
      Name: "ItemSpend"
      TransactionSettingV2:
        DistributorNamespaceId: "grn:gs2:{region}:{ownerId}:distributor:default"
        EnableParallelExecution: false
