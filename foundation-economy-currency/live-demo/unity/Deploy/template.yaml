GS2TemplateFormatVersion: 2019-05-01
Resources:
  ExchangeCurrentRateMaster_CurrencyGrant:
    Type: GS2::Exchange::CurrentRateMaster
    Properties:
      NamespaceName: CurrencyGrant
      Settings:
        version: 2019-08-19
        rateModels:
          - name: freedeposit
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: Gs2Money2:DepositByUserId
                request: '{"namespaceName":"Currency","userId":"#{userId}","slot":"#{slot}","depositTransactions":[{"price":0,"currency":"","count":100}]}'
          - name: paiddeposit
            verifyActions: []
            consumeActions: []
            acquireActions:
              - action: Gs2Money2:DepositByUserId
                request: '{"namespaceName":"Currency","userId":"#{userId}","slot":"#{slot}","depositTransactions":[{"price":120,"currency":"JPY","count":50}]}'
        incrementalRateModels: []
      Mode: direct
    DependsOn:
      - ExchangeNamespace_CurrencyGrant
  ExchangeNamespace_CurrencyGrant:
    Type: GS2::Exchange::Namespace
    Properties:
      Name: CurrencyGrant
      TransactionSetting:
        AcquireActionUseJobQueue: false
        DistributorNamespaceId: grn:gs2:{region}:{ownerId}:distributor:default
        EnableAtomicCommit: true
        EnableAutoRun: true
        QueueNamespaceId: grn:gs2:{region}:{ownerId}:queue:default
        TransactionUseDistributor: false
  Money2CurrentModelMaster_Currency:
    Type: GS2::Money2::CurrentModelMaster
    Properties:
      NamespaceName: Currency
      Settings:
        version: 2024-06-20
        storeContentModels:
          - appleAppStore:
              productId: io.gs2.demo.coin.large
            googlePlay:
              productId: io.gs2.demo.coin.large
            name: coin_large
          - appleAppStore:
              productId: io.gs2.demo.coin.medium
            googlePlay:
              productId: io.gs2.demo.coin.medium
            name: coin_medium
          - appleAppStore:
              productId: io.gs2.demo.coin.small
            googlePlay:
              productId: io.gs2.demo.coin.small
            name: coin_small
        storeSubscriptionContentModels: []
      Mode: direct
    DependsOn:
      - Money2Namespace_Currency
  Money2Namespace_Currency:
    Type: GS2::Money2::Namespace
    Properties:
      CurrencyUsagePriority: PrioritizeFree
      Name: Currency
      PlatformSetting:
        AppleAppStore: {}
        Fake:
          AcceptFakeReceipt: Accept
        GooglePlay: {}
      SharedFreeCurrency: false
      TransactionSetting:
        DistributorNamespaceId: grn:gs2:{region}:{ownerId}:distributor:default
        EnableAutoRun: false
        QueueNamespaceId: grn:gs2:{region}:{ownerId}:queue:default
